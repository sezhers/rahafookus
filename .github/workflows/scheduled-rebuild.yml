name: Scheduled rebuild

# Triggers a fresh Cloudflare Pages deployment every day so that
# blog posts with a future-dated `pubDate` in their frontmatter go
# live automatically on their scheduled date, without needing a
# manual push or deploy.
#
# Requires a repository secret `CLOUDFLARE_DEPLOY_HOOK_URL` containing
# a Cloudflare Pages "Deploy hook" URL. Create one in the Cloudflare
# dashboard under Workers & Pages -> your project -> Settings ->
# Builds & deployments -> Deploy hooks, then add the resulting URL as
# a secret at: repo Settings -> Secrets and variables -> Actions.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
